name: Build and publish Quartz images

on:
  push:
    branches: [main]
    paths:
      - content/**
      - gm/**
      - quartz/**
      - scripts/**
      - quartz.config.yaml
      - quartz.config.default.yaml
      - quartz.ts
      - quartz.lock.json
      - package.json
      - package-lock.json
      - tsconfig.json
      - globals.d.ts
      - index.d.ts
      - Dockerfile.player
      - Dockerfile.gm
      - nginx.conf
      - .dockerignore
      - .github/workflows/build-deploy.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: player
            dockerfile: Dockerfile.player
          - target: gm
            dockerfile: Dockerfile.gm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/eryndor-wiki-${{ matrix.target }}:latest
